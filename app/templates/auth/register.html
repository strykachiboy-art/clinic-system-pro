{% extends "base.html" %}
{% block body %}<main class="flex min-h-screen items-center justify-center px-5 py-12"><section class="panel w-full max-w-md p-8"><p class="eyebrow">Clinic administration</p><h1 class="mt-3 text-3xl font-semibold">Create account</h1><form class="mt-8 space-y-5" method="post"><label class="block text-sm font-semibold">Full name<input class="mt-2 w-full rounded-md border border-[#cbd8cd] px-3 py-2.5" name="name" required></label><label class="block text-sm font-semibold">Email<input class="mt-2 w-full rounded-md border border-[#cbd8cd] px-3 py-2.5" name="email" type="email" required></label><label class="block text-sm font-semibold">Password<input class="mt-2 w-full rounded-md border border-[#cbd8cd] px-3 py-2.5" name="password" type="password" required></label><button class="w-full rounded-md bg-[#176b5b] px-4 py-3 font-semibold text-white" type="submit">Create account</button></form></section></main>{% endblock %}
