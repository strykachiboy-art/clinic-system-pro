{% extends "base.html" %}

{% block body %}
<main class="flex min-h-screen items-center justify-center px-5 py-12">
  <section class="panel w-full max-w-md p-8">
    <p class="eyebrow">Clinic operations</p>
    <h1 class="mt-3 text-3xl font-semibold">Welcome back</h1>
    <p class="mt-2 text-sm text-[#6b8175]">Sign in to manage your clinic workspace.</p>
    <form data-login-form class="mt-8 space-y-5" method="post" action="#">
      <label class="block text-sm font-semibold">Email<input name="email" type="email" autocomplete="email" required class="mt-2 w-full rounded-md border border-[#cbd8cd] px-3 py-2.5 outline-none focus:border-[#176b5b]" /></label>
      <label class="block text-sm font-semibold">Password<input name="password" type="password" autocomplete="current-password" required class="mt-2 w-full rounded-md border border-[#cbd8cd] px-3 py-2.5 outline-none focus:border-[#176b5b]" /></label>
      <button class="w-full rounded-md bg-[#176b5b] px-4 py-3 font-semibold text-white hover:bg-[#125548]" type="submit">Sign in</button>
      <p data-login-message class="min-h-5 text-sm text-red-700" role="alert"></p>
    </form>
  </section>
</main>
{% endblock %}
