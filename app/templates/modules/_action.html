{% extends "layouts/app.html" %}
{% block content %}<section class="mb-8"><p class="eyebrow">{{ page_section or "Workflow" }}</p><h2 class="mt-2 text-3xl font-semibold">{{ page_title }}</h2><p class="mt-2 text-sm text-[#6b8175]">Complete this workflow with the appropriate service action.</p></section><form class="panel max-w-2xl space-y-6 p-6" method="post"><label class="block text-sm font-semibold">Reason or notes<textarea class="mt-2 min-h-32 w-full rounded-md border border-[#cbd8cd] px-3 py-2.5" name="notes"></textarea></label><button class="rounded-md bg-[#176b5b] px-4 py-2.5 text-sm font-semibold text-white" type="submit">Continue</button></form>{% endblock %}
