{% extends "layouts/app.html" %}
{% block content %}<section class="mb-8"><p class="eyebrow">{{ page_section or "Record" }}</p><h2 class="mt-2 text-3xl font-semibold">{{ page_title }}</h2></section><form class="panel max-w-3xl space-y-6 p-6" method="post"><div class="grid gap-5 md:grid-cols-2"><label class="text-sm font-semibold">Name<input class="mt-2 w-full rounded-md border border-[#cbd8cd] px-3 py-2.5" name="name" type="text"></label><label class="text-sm font-semibold">Status<select class="mt-2 w-full rounded-md border border-[#cbd8cd] px-3 py-2.5" name="status"><option>Active</option><option>Pending</option><option>Inactive</option></select></label></div><label class="block text-sm font-semibold">Notes<textarea class="mt-2 min-h-32 w-full rounded-md border border-[#cbd8cd] px-3 py-2.5" name="notes"></textarea></label><div class="flex justify-end gap-3"><a href="#" class="rounded-md border border-[#cbd8cd] px-4 py-2.5 text-sm font-semibold">Cancel</a><button class="rounded-md bg-[#176b5b] px-4 py-2.5 text-sm font-semibold text-white" type="submit">Save record</button></div></form>{% endblock %}
