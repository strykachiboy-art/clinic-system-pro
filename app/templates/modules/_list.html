{% extends "layouts/app.html" %}
{% block content %}<section class="mb-8 flex items-end justify-between gap-4"><div><p class="eyebrow">{{ page_section or "Records" }}</p><h2 class="mt-2 text-3xl font-semibold">{{ page_title }}</h2><p class="mt-2 text-sm text-[#6b8175]">Review, filter, and manage records.</p></div><a href="#" class="rounded-md bg-[#176b5b] px-4 py-3 text-sm font-semibold text-white">Add new</a></section><section class="panel overflow-hidden"><div class="border-b border-[#dce5dc] p-4"><input class="w-full max-w-md rounded-md border border-[#cbd8cd] px-3 py-2" placeholder="Search records" type="search"></div><div class="min-h-64 overflow-x-auto"><table class="w-full text-left text-sm"><thead class="bg-[#f1f5ef] text-xs uppercase tracking-wider text-[#6b8175]"><tr><th class="px-5 py-3">Record</th><th class="px-5 py-3">Status</th><th class="px-5 py-3">Updated</th><th class="px-5 py-3"></th></tr></thead><tbody><tr><td class="px-5 py-8 text-[#6b8175]" colspan="4">Connect this table to the module API.</td></tr></tbody></table></div></section>{% endblock %}
